<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de mission - Le Koup de Main</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuration Supabase -->
    <script src="supabase-config.js"></script>
</head>
<body class="antialiased bg-lkdm-bg min-h-screen flex flex-col selection:bg-lkdm-accent selection:text-white">

    <!-- Top Navbar Minimaliste -->
    <nav class="w-full py-5 px-8 bg-white/90 backdrop-blur-sm sticky top-0 z-50 border-b border-black/5">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="font-bold text-xl text-lkdm-text tracking-tight">Le Koup de Main</div>
            <a href="https://lekoupdemain.ch" class="text-xs font-semibold text-lkdm-secondary hover:text-lkdm-accent transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Retour au site
            </a>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-12">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-200/80 shadow-xl space-y-8">
            
            <div class="text-space space-y-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-lkdm-secondary">Service d'aide valaisan</span>
                <h1 class="text-2xl md:text-3xl font-bold text-lkdm-text">Demander un Koup de Main</h1>
                <p class="text-xs text-slate-500">Remplissez ce formulaire pour soumettre votre besoin. Notre équipe valaisanne vous contactera rapidement.</p>
            </div>

            <!-- Toast de succès / erreur -->
            <div id="form-alert" class="hidden p-4 rounded-xl text-xs font-medium border"></div>

            <form onsubmit="submitPublicMissionRequest(event)" class="space-y-6 text-sm">
                
                <!-- Section : Informations personnelles -->
                <div class="space-y-4">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-lkdm-secondary border-b pb-2">1. Vos Coordonnées</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Prénom *</label>
                            <input type="text" id="pub-firstname" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Nom *</label>
                            <input type="text" id="pub-lastname" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Téléphone *</label>
                            <input type="tel" id="pub-phone" required placeholder="+41 79 000 00 00" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Email *</label>
                            <input type="email" id="pub-email" required placeholder="nom@exemple.ch" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-600 mb-1">Rue et numéro *</label>
                            <input type="text" id="pub-address" required placeholder="Rue du Rhône 10" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">NPA *</label>
                            <input type="text" id="pub-npa" required placeholder="1950" oninput="syncPublicLocation()" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Localité *</label>
                            <input type="text" id="pub-city" required placeholder="Sion" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Date de naissance *</label>
                            <input type="date" id="pub-birth" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Sexe *</label>
                            <select id="pub-gender" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                                <option value="homme">Homme</option>
                                <option value="femme">Femme</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Langue *</label>
                            <select id="pub-lang" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-3 py-2.5 text-xs">
                                <option value="Français">Français</option>
                                <option value="Allemand">Allemand</option>
                                <option value="Anglais">Anglais</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Type d'origine *</label>
                            <select id="pub-srctype" required class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-3 py-2.5 text-xs">
                                <option value="Bouche à oreille">Bouche à oreille</option>
                                <option value="Réseaux sociaux">Réseaux sociaux</option>
                                <option value="Recherche Google">Recherche Google</option>
                                <option value="Proche / Famille">Proche / Famille</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Origine précise *</label>
                            <input type="text" id="pub-src" required placeholder="Ex: Nom..." class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-3 py-2.5 text-xs">
                        </div>
                    </div>
                </div>

                <!-- Section : Détails de la mission -->
                <div class="space-y-4 pt-4">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-lkdm-secondary border-b pb-2">2. Détails du Koup de Main</h3>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Description exacte de la mission *</label>
                        <textarea id="pub-desc" required rows="3" placeholder="Décrivez précisément ce dont vous avez besoin (ex: aide au jardinage, courses, compagnie...)" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-lkdm-accent"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Périodes souhaitées *</label>
                            <input type="text" id="pub-periods" required placeholder="Ex: Matin en semaine, Lundi prochain..." class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Temps estimé (en heures) *</label>
                            <input type="number" step="0.5" id="pub-est-hours" required value="2.0" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-lkdm-accent">
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="btn-submit-mission" class="w-full bg-lkdm-accent text-white py-3.5 rounded-[50px] font-medium text-xs hover:bg-[#b53838] transition shadow-sm">
                        Soumettre ma demande de mission
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script>
        // Synchronisation automatique de la ville selon le NPA (ex: 1950 -> Sion, 3960 -> Sierre, 1920 -> Martigny)
        function syncPublicLocation() {
            const npa = document.getElementById('pub-npa').value.trim();
            const cityInput = document.getElementById('pub-city');
            if (npa === '1950') cityInput.value = 'Sion';
            else if (npa === '3960') cityInput.value = 'Sierre';
            else if (npa === '1920') cityInput.value = 'Martigny';
        }

        async function submitPublicMissionRequest(e) {
            e.preventDefault();
            const alertBox = document.getElementById('form-alert');
            const btn = document.getElementById('btn-submit-mission');
            
            alertBox.classList.add('hidden');
            btn.innerText = "Enregistrement en cours...";
            btn.disabled = true;

            const email = document.getElementById('pub-email').value.trim();
            const phone = document.getElementById('pub-phone').value.trim();
            const firstname = document.getElementById('pub-firstname').value.trim();
            const lastname = document.getElementById('pub-lastname').value.trim();

            try {
                // 1. Vérifier si un profil client existe déjà avec cet email dans la table profiles
                let profileId = null;
                const { data: existingProfiles, error: searchError } = await window.supabaseClient
                    .from('profiles')
                    .select('id')
                    .eq('email', email)
                    .maybeSingle();

                if (existingProfiles) {
                    profileId = existingProfiles.id;
                } else {
                    // Création du profil client s'il n'existe pas
                    const { data: newProfile, error: profileError } = await window.supabaseClient
                        .from('profiles')
                        .insert([{
                            firstname: firstname,
                            lastname: lastname,
                            email: email,
                            phone: phone,
                            address: document.getElementById('pub-address').value.trim(),
                            npa: document.getElementById('pub-npa').value.trim(),
                            city: document.getElementById('pub-city').value.trim(),
                            birth_date: document.getElementById('pub-birth').value,
                            gender: document.getElementById('pub-gender').value,
                            language: document.getElementById('pub-lang').value,
                            source_type: document.getElementById('pub-srctype').value,
                            source_detail: document.getElementById('pub-src').value,
                            role: 'client'
                        }])
                        .select()
                        .single();

                    if (profileError) throw profileError;
                    profileId = newProfile.id;
                }

                // 2. Générer un code de mission unique (ex: M2026_X)
                const { count } = await window.supabaseClient.from('missions').select('*', { count: 'exact', head: true });
                const nextNum = (count || 0) + 1;
                const missionCode = `M2026_${nextNum}`;

                // 3. Enregistrer la mission dans la table missions avec le statut "Nouveau"
                const { error: missionError } = await window.supabaseClient
                    .from('missions')
                    .insert([{
                        mission_code: missionCode,
                        client_id: profileId,
                        description: document.getElementById('pub-desc').value.trim(),
                        language: document.getElementById('pub-lang').value,
                        periods: document.getElementById('pub-periods').value.trim(),
                        estimated_hours: Number(document.getElementById('pub-est-hours').value),
                        matching_status: 'Nouveau',
                        payment_type: 'Facture'
                    }]);

                if (missionError) throw missionError;

                // Affichage du succès
                alertBox.className = "p-4 rounded-xl text-xs font-medium border bg-emerald-50 text-emerald-700 border-emerald-200";
                alertBox.innerText = "Votre demande a été transmise avec succès ! Notre équipe vous contactera très rapidement.";
                alertBox.classList.remove('hidden');
                
                // Réinitialiser le formulaire
                e.target.reset();
                btn.innerText = "Demande envoyée avec succès";

            } catch (err) {
                console.error("Erreur lors de la soumission :", err);
                alertBox.className = "p-4 rounded-xl text-xs font-medium border bg-red-50 text-lkdm-accent border-red-200";
                alertBox.innerText = "Une erreur est survenue : " + err.message;
                alertBox.classList.remove('hidden');
                btn.innerText = "Soumettre ma demande de mission";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
