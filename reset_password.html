<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Définition du mot de passe - Le Koup de Main</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="antialiased bg-lkdm-bg flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-md space-y-6">
        <h1 class="font-bold text-2xl text-lkdm-text text-center">Choisissez votre mot de passe</h1>
        
        <form onsubmit="handleUpdatePassword(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">Nouveau mot de passe</label>
                <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-lkdm-accent">
            </div>
            <button type="submit" class="w-full bg-lkdm-accent text-red py-3.5 rounded-[50px] font-medium text-xs">
                Enregistrer et se connecter
            </button>
        </form>
    </div>

    <script>
        async function handleUpdatePassword(event) {
            event.preventDefault();
            const password = document.getElementById('new-password').value;

            // Met à jour le mot de passe de l'utilisateur connecté via le lien d'invitation
            const { error } = await window.supabaseClient.auth.updateUser({ password: password });

            if (error) {
                alert("Erreur : " + error.message);
                return;
            }

            alert("Mot de passe enregistré avec succès !");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
