<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKDM - Réinitialisation du mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="config.js"></script>
</head>
<body class="antialiased flex items-center justify-center min-h-screen bg-lkdm-bg selection:bg-lkdm-accent selection:text-white p-4">

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-md space-y-6">
        <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-lkdm-secondary">Sécurité</span>
            <h2 class="text-2xl font-bold text-lkdm-text mt-0.5">Réinitialisation</h2>
            <p id="page-subtitle" class="text-xs text-slate-500 mt-1">Entrez votre e-mail pour recevoir un code de validation.</p>
        </div>

        <!-- ÉTAPE 1 : Demande du code -->
        <form id="step-email-form" onsubmit="handleSendCode(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Votre email *</label>
                <input type="email" id="reset-email" required placeholder="votre@email.com" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-send-code" class="w-full py-3 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838] transition">
                    Envoyer le code de réinitialisation
                </button>
            </div>
            <div class="text-center pt-2">
                <a href="login.html" class="text-xs text-slate-500 hover:text-lkdm-accent">Retour à la connexion</a>
            </div>
        </form>

        <!-- ÉTAPE 2 : Saisie du code reçu et du nouveau mot de passe -->
        <form id="step-verify-form" onsubmit="handleVerifyAndReset(event)" class="space-y-4 text-sm hidden">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Code à 6 chiffres reçu par e-mail *</label>
                <input type="text" id="reset-token" required placeholder="123456" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs tracking-widest text-center font-bold text-lg">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Nouveau mot de passe *</label>
                <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-verify-submit" class="w-full py-3 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838] transition">
                    Valider et changer le mot de passe
                </button>
            </div>
        </form>
    </div>

    <script>
        let targetEmail = "";

        async function handleSendCode(event) {
            event.preventDefault();
            targetEmail = document.getElementById('reset-email').value.trim();
            const btn = document.getElementById('btn-send-code');

            btn.innerText = "Envoi en cours...";
            btn.disabled = true;

            const { error } = await window.supabaseClient.auth.resetPasswordForEmail(targetEmail);

            btn.innerText = "Envoyer le code de réinitialisation";
            btn.disabled = false;

            if (error) {
                alert("Erreur : " + error.message);
                return;
            }

            alert("Un code à 6 chiffres a été envoyé par e-mail.");
            document.getElementById('step-email-form').classList.add('hidden');
            document.getElementById('step-verify-form').classList.remove('hidden');
            document.getElementById('page-subtitle').innerText = "Entrez le code reçu et votre nouveau mot de passe.";
        }

        async function handleVerifyAndReset(event) {
            event.preventDefault();
            const token = document.getElementById('reset-token').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-verify-submit');

            if (!newPassword || newPassword.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            btn.innerText = "Vérification...";
            btn.disabled = true;

            // 1. Valide le code OTP et établit la session sécurisée
            const { error: otpError } = await window.supabaseClient.auth.verifyOtp({
                email: targetEmail,
                token: token,
                type: 'recovery'
            });

            if (otpError) {
                alert("Code invalide ou expiré : " + otpError.message);
                btn.innerText = "Valider et changer le mot de passe";
                btn.disabled = false;
                return;
            }

            // 2. Met à jour le mot de passe avec la session active fraîchement créée
            const { error: updateError } = await window.supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (updateError) {
                alert("Erreur lors de la mise à jour : " + updateError.message);
                btn.innerText = "Valider et changer le mot de passe";
                btn.disabled = false;
                return;
            }

            alert("Votre mot de passe a été modifié avec succès !");
            await window.supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
