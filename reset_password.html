<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKDM - Réinitialisation du mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="config.js"></script>
</head>
<body class="antialiased flex items-center justify-center min-h-screen bg-lkdm-bg selection:bg-lkdm-accent selection:text-white p-4">

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-md space-y-6">
        <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-lkdm-secondary">Sécurité</span>
            <h2 class="text-2xl font-bold text-lkdm-text mt-0.5">Nouveau mot de passe</h2>
            <p id="page-subtitle" class="text-xs text-slate-500 mt-1">Veuillez entrer votre nouveau mot de passe ci-dessous.</p>
        </div>

        <!-- Message d'erreur si le lien est invalide -->
        <div id="error-container" class="hidden space-y-4 text-center">
            <p class="text-xs text-red-600 font-medium">Le lien de réinitialisation est invalide, a déjà été utilisé ou a expiré.</p>
            <a href="login.html" class="inline-block w-full py-3 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838] transition text-center">
                Retour à la connexion
            </a>
        </div>

        <!-- Formulaire de modification -->
        <form id="reset-form" onsubmit="handleResetPassword(event)" class="space-y-4 text-sm hidden">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Nouveau mot de passe *</label>
                <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-submit" class="w-full py-3 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838] transition">
                    Mettre à jour le mot de passe
                </button>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) {
                alert("Erreur critique : Le client Supabase n'est pas chargé.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const tokenHash = urlParams.get('token_hash');
            const type = urlParams.get('type');

            let sessionEstablished = false;

            try {
                // 1. Si on a un code PKCE dans l'URL
                if (code) {
                    const { error } = await window.supabaseClient.auth.exchangeCodeForSession(code);
                    if (!error) sessionEstablished = true;
                } 
                // 2. Si on a un token_hash direct
                else if (tokenHash) {
                    const { error } = await window.supabaseClient.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: type || 'recovery'
                    });
                    if (!error) sessionEstablished = true;
                }
                // 3. Vérification de secours si une session est déjà active
                else {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) sessionEstablished = true;
                }
            } catch (err) {
                console.error("Erreur lors de l'établissement de la session :", err);
            }

            // Si la session est confirmée, on affiche le formulaire
            if (sessionEstablished) {
                document.getElementById('reset-form').classList.remove('hidden');
            } else {
                document.getElementById('error-container').classList.remove('hidden');
            }
        });

        async function handleResetPassword(event) {
            event.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-submit');

            if (!newPassword || newPassword.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            btn.innerText = "Mise à jour en cours...";
            btn.disabled = true;

            const { error } = await window.supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
                btn.innerText = "Mettre à jour le mot de passe";
                btn.disabled = false;
                return;
            }

            alert("Votre mot de passe a été modifié avec succès ! Vous pouvez vous connecter.");
            await window.supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
