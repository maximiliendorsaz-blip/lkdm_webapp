<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKDM - Réinitialisation du mot de passe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS Externe LKDM -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuration Supabase -->
    <script src="supabase-config.js"></script>
    <!-- Configuration Centralisée LKDM -->
    <script src="config.js"></script>
</head>
<body class="antialiased flex items-center justify-center min-h-screen bg-lkdm-bg selection:bg-lkdm-accent selection:text-white p-4">

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-md space-y-6">
        <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-lkdm-secondary">Sécurité</span>
            <h2 class="text-2xl font-bold text-lkdm-text mt-0.5">Nouveau mot de passe</h2>
            <p class="text-xs text-slate-500 mt-1">Veuillez entrer votre nouveau mot de passe ci-dessous.</p>
        </div>

        <!-- Formulaire de modification direct -->
        <form onsubmit="handleResetPassword(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Nouveau mot de passe *</label>
                <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-submit" class="w-full py-3 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838] transition">
                    Mettre à jour le mot de passe
                </button>
            </div>
        </form>
    </div>

    <script>
        async function initResetPage() {
            if (!window.supabaseClient) return;

            const urlParams = new URLSearchParams(window.location.search);
            const tokenHash = urlParams.get('token_hash');
            const type = urlParams.get('type');
            const code = urlParams.get('code');

            // 1. Si on a un token_hash dans l'URL (votre cas exact)
            if (tokenHash) {
                const { error } = await window.supabaseClient.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: type || 'recovery'
                });
                if (error) {
                    console.error("Erreur d'échange du token_hash :", error.message);
                }
            } 
            // 2. Si on a un code PKCE classique
            else if (code) {
                const { error } = await window.supabaseClient.auth.exchangeCodeForSession(code);
                if (error) {
                    console.error("Erreur d'échange du code :", error.message);
                }
            }

            // Petite pause de sécurité pour laisser le client enregistrer la session en mémoire
            await new Promise(resolve => setTimeout(resolve, 500));

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            
            if (!session) {
                console.warn("Attention : Aucune session active détectée au chargement, mais le formulaire reste ouvert pour tenter la mise à jour.");
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-submit');

            if (!newPassword || newPassword.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            btn.innerText = "Mise à jour en cours...";
            btn.disabled = true;

            const { error } = await window.supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Erreur de mise à jour : " + error.message + "\n(Veuillez refaire une demande si le lien a expiré).");
                btn.innerText = "Mettre à jour le mot de passe";
                btn.disabled = false;
                return;
            }

            alert("Votre mot de passe a été modifié avec succès ! Vous allez être redirigé vers la connexion.");
            
            await window.supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initResetPage();
        });
    </script>
</body>
</html>
