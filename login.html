<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Le Koup de Main</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Votre fichier de configuration Supabase existant -->
    <script src="supabase-config.js"></script>
</head>
<body class="antialiased bg-lkdm-bg flex items-center justify-center min-h-screen selection:bg-lkdm-accent selection:text-white">

    <div class="bg-white p-8 rounded-3xl border border-slate-200/80 shadow-xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <h1 class="font-bold text-2xl text-lkdm-text tracking-tight">Le Koup de Main</h1>
            <p class="text-xs text-lkdm-secondary uppercase tracking-wider font-semibold">Connexion à votre espace</p>
        </div>

        <!-- Boîte d'erreur si l'identifiant/mdp est faux -->
        <div id="login-error" class="hidden bg-red-50 text-lkdm-accent p-3 rounded-xl text-xs font-medium border border-red-200"></div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">Adresse Email</label>
                <input type="email" id="login-email" required placeholder="nom@exemple.ch" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-lkdm-accent">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">Mot de passe</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-lkdm-accent">
            </div>
            <div class="flex items-center justify-between text-xs mt-2 mb-4">
                <a href="#" onclick="openForgotPasswordModal(event)" class="text-lkdm-secondary hover:text-lkdm-accent transition font-medium">
                    Mot de passe oublié ?
                </a>
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-login" class="w-full bg-lkdm-accent text-white py-3.5 rounded-[50px] font-medium text-xs hover:bg-[#b53838] transition shadow-sm">
                    Se connecter
                </button>
            </div>
        </form>
    </div>

    <!-- MODAL : MOT DE PASSE OUBLIÉ -->
    <div id="modal-forgot-password" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 relative">
            <button onclick="closeModal('modal-forgot-password')" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">
                <i class="fa-solid fa-times"></i>
            </button>
            <h3 class="text-xl font-bold text-lkdm-text mb-2">Réinitialisation</h3>
            <p class="text-xs text-slate-500 mb-5">Entrez votre adresse e-mail. Nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
            
            <form onsubmit="handleForgotPassword(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Votre email *</label>
                    <input type="email" id="forgot-email" required placeholder="nom@exemple.ch" class="w-full bg-lkdm-bg border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal('modal-forgot-password')" class="px-4 py-2 bg-slate-100 rounded-full text-xs font-medium">Annuler</button>
                    <button type="submit" id="btn-forgot-submit" class="px-5 py-2 bg-lkdm-accent text-white rounded-full text-xs font-medium shadow-sm hover:bg-[#b53838]">Envoyer le lien</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorBox = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');

            errorBox.classList.add('hidden');
            btn.innerText = "Connexion en cours...";
            btn.disabled = true;

            // 1. On tente de connecter l'utilisateur via ses identifiants
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorBox.innerText = "Identifiant ou mot de passe incorrect.";
                errorBox.classList.remove('hidden');
                btn.innerText = "Se connecter";
                btn.disabled = false;
                return;
            }

            // 2. Une fois connecté, on va chercher son rôle dans votre table "profiles" pour l'envoyer sur le bon dashboard
            const user = data.user;
            const { data: profile } = await window.supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (profile) {
                if (profile.role === 'admin') {
                    window.location.href = 'dashboard_admin.html';
                } else if (profile.role === 'student') {
                    window.location.href = 'dashboard_student.html';
                } else if (profile.role === 'client') {
                    window.location.href = 'dashboard_customer.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        }
        function openForgotPasswordModal(e) {
    e.preventDefault();
    document.getElementById('modal-forgot-password').classList.remove('hidden');
}

function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
}

async function handleForgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) return;

    // Utilise une URL de redirection propre vers une page dédiée ou les réglages sans hash
    const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/settings.html',
    });

    if (error) {
        alert("Erreur : " + error.message);
        return;
    }

    alert("Un e-mail de réinitialisation a été envoyé à " + email + ". Veuillez vérifier votre boîte mail.");
    closeModal('modal-forgot-password');
}
    </script>
</body>
</html>
